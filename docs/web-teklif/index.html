<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teklif İste · Kar-Men Airtech</title>
<meta name="description" content="Kar-Men Airtech ürünleri için ölçü, renk ve adet seçerek teklif isteyin.">
<meta name="robots" content="noindex">
<style>
:root{--tq:#0e9fae;--tq-d:#0a7f8b;--tq-l:#e6f7f8;--ink:#1d2329;--ink-2:#46505a;--ink-3:#7a848e;--line:#dfe5ea;--bg:#ffffff;--soft:#f5f8fa;--ant:#2b3138;--err:#c62828;--ok:#2e7d32;--r:12px;
  --f:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f)}
button,input,select,textarea{font:inherit;color:inherit}
.wt{max-width:1080px;margin:0 auto;padding:20px 16px 28px}
.wt h1{font-size:24px;margin:0 0 4px;color:var(--ant)}.wt .sub{color:var(--ink-2);margin:0 0 18px}
.steps{display:flex;gap:8px;margin:0 0 18px;flex-wrap:wrap}
.steps span{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:99px;background:var(--soft);color:var(--ink-3);font-weight:600;font-size:13.5px}
.steps b{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:12.5px}
.steps span.on{background:var(--tq-l);color:var(--tq-d)}.steps span.on b{background:var(--tq);color:#fff;border-color:var(--tq)}
.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:18px;align-items:start}
.card{border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:16px}
.card h2{font-size:16px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;cursor:pointer;font-size:13.5px}
.chip[aria-pressed=true]{background:var(--tq);border-color:var(--tq);color:#fff}
.in{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
.in:focus{border-color:var(--tq);box-shadow:0 0 0 3px var(--tq-l)}
.plist{display:flex;flex-direction:column;margin-top:10px;max-height:560px;overflow:auto;border-top:1px solid var(--line)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.prow .k{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;color:var(--ink-3)}
.prow .n{font-weight:600}
.btn{border:0;border-radius:10px;padding:10px 16px;background:var(--tq);color:#fff;font-weight:700;cursor:pointer}
.btn:hover{background:var(--tq-d)}.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:7px 12px;font-size:13.5px}.btn.gh{background:#fff;color:var(--tq-d);border:1px solid var(--tq)}.btn.gh:hover{background:var(--tq-l)}
.btn.x{background:transparent;color:var(--ink-3);padding:4px 8px;font-size:18px;line-height:1}
.cfg{grid-column:1/-1;background:var(--soft);border-radius:10px;padding:12px;margin:4px 0 6px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.cfg label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-2);font-weight:600}
.cfg .full{grid-column:1/-1}.cfg .act{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
.ral{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}.ral button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 8px;font-size:12px;cursor:pointer}
.ral button[aria-pressed=true]{border-color:var(--tq);background:var(--tq-l)}
.cart{display:flex;flex-direction:column;gap:8px}
.ci{border:1px solid var(--line);border-left:4px solid var(--tq);border-radius:10px;padding:10px 10px 10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}
.ci .n{font-weight:600;font-size:14px}.ci small{display:block;color:var(--ink-2);font-size:12.5px}
.ci .full{grid-column:1/-1}.ci .q{display:flex;align-items:center;gap:6px}.ci .q input{width:76px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;text-align:right}
.empty{color:var(--ink-3);text-align:center;padding:22px 8px;border:1px dashed var(--line);border-radius:10px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--ink-2)}
.chk{display:flex!important;flex-direction:row!important;gap:8px;align-items:flex-start;font-weight:400!important}
.chk input{margin-top:3px;accent-color:var(--tq)}
.hp{position:absolute;left:-5000px;width:1px;height:1px;overflow:hidden}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.msg{padding:10px 12px;border-radius:10px;font-size:14px;margin-top:10px}.msg.err{background:#fdecea;color:var(--err)}
.done{text-align:center;padding:40px 16px}.done .ic{width:64px;height:64px;border-radius:50%;background:var(--tq);color:#fff;display:grid;place-items:center;font-size:32px;margin:0 auto 14px}
.done h2{margin:0 0 6px;font-size:22px}.done .no{font-family:ui-monospace,monospace;font-weight:700;color:var(--tq-d);font-size:18px}
.note{color:var(--ink-3);font-size:12.5px}
.badge{background:var(--tq);color:#fff;border-radius:99px;padding:1px 8px;font-size:12px}
.load{padding:30px;text-align:center;color:var(--ink-3)}
@media (max-width:820px){.plist{max-height:none}.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.cartcard{order:-1}}
</style>
</head>
<body>
<div class="wt" id="app"><div class="load">Ürünler yükleniyor…</div></div>
<script>
(() => {
  // Ayarlar: katalog Firestore'daki herkese açık belgeden, gönderim sunucu fonksiyonuna
  const PROJE = "karmen-erp", BOLGE = "europe-west3";
  const KATALOG = `https://firestore.googleapis.com/v1/projects/${PROJE}/databases/(default)/documents/web_katalog/v1`;
  const API = `https://${BOLGE}-${PROJE}.cloudfunctions.net/webTeklif`;
  const WA = "905011363642";
  const YUZEY = ["Elektrostatik boya", "Galvaniz (boyasız)", "Ham (boyasız)", "Eloksal", "Paslanmaz"];
  const $ = s => document.querySelector(s), app = $("#app");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const fold = s => String(s || "").toLocaleUpperCase("tr").replace(/Ç/g, "C").replace(/Ğ/g, "G").replace(/İ/g, "I").replace(/Ö/g, "O").replace(/Ş/g, "S").replace(/Ü/g, "U");
  const trFold = s => fold(s).replace(/[^A-Z0-9]/g, "");
  const S = { kat: null, grup: "", q: "", ac: null, sepet: [], adim: 1, t0: Date.now(), gonder: false, hata: "", sonuc: null, form: {} };
  try { const x = JSON.parse(localStorage.getItem("karmen.webteklif") || "null"); if (x && Array.isArray(x.sepet)) { S.sepet = x.sepet; S.form = x.form || {}; } } catch (e) {}
  const sakla = () => { try { localStorage.setItem("karmen.webteklif", JSON.stringify({ sepet: S.sepet, form: S.form })); } catch (e) {} };
  // iframe içindeyse yüksekliği üst sayfaya bildir
  const boy = () => { try { parent.postMessage({ karmenTeklifH: document.documentElement.scrollHeight }, "*"); } catch (e) {} };
  new ResizeObserver(boy).observe(document.body);

  const varList = (kod, ad) => {
    const txt = S.kat.varyasyon || "", L = txt.split("\n"); if (!/\|\s*metraj\s*:/i.test(txt)) L.push("~slot | Metraj: #m"); L.push(...(S.kat.varHazir || []));
    const gor = new Set();
    return L.map(l => { const m = l.match(/^\s*([^|]+)\|\s*([^:]+):\s*(.+)$/); if (!m) return null; const t = m[3].trim();
      return { onek: m[1].split(",").map(x => x.trim()).filter(Boolean), ad: m[2].trim(), serbest: t[0] === "#", birim: t[0] === "#" ? t.slice(1).trim() : "", sec: t[0] === "#" ? [] : t.split(",").map(x => x.trim()).filter(Boolean) }; })
      .filter(Boolean).filter(v => v.onek.includes("*") || v.onek.some(o => o[0] === "~" ? trFold(ad).includes(trFold(o.slice(1))) : String(kod || "").startsWith(o)))
      .filter(v => { const k = trFold(v.ad); if (gor.has(k)) return false; gor.add(k); return true; })
      .filter((v, i, A) => !(trFold(v.ad) === trFold("Sineklik") && A.some(x => trFold(x.ad) === trFold("Arka tel"))))
      .filter(v => !/ambalaj/i.test(v.ad));
  };
  const boyali = y => /^(elektrostatik|yaş) boya$/i.test(y || "");
  const renkAd = r => !r ? "" : boyali(r.yuzey) ? `RAL ${r.kod || "?"}` : r.yuzey + (/eloksal/i.test(r.yuzey) && r.kod ? " · " + r.kod : "");
  const varAd = v => Object.entries(v || {}).filter(([, x]) => x).map(([a, x]) => `${a}: ${x}`).join(" · ");

  async function yukle() {
    try { const r = await fetch(KATALOG); if (!r.ok) throw new Error(r.status); const d = await r.json(); S.kat = JSON.parse(d.fields.json.stringValue); }
    catch (e) { app.innerHTML = `<div class="load">Ürün listesi şu an yüklenemedi. Lütfen daha sonra tekrar deneyin ya da <a href="https://wa.me/${WA}" target="_blank" rel="noopener">WhatsApp</a> üzerinden yazın.</div>`; boy(); return; }
    S.idx = S.kat.u.map(u => ({ id: u[0], kod: u[1], ad: u[2], birim: u[3] || "Adet", f: fold(u[1] + " " + u[2]) }));
    ciz();
  }
  function urunler() {
    const q = fold(S.q).split(/\s+/).filter(Boolean);
    return S.idx.filter(u => (!S.grup || u.kod.startsWith(S.grup)) && q.every(w => u.f.includes(w))).slice(0, 80);
  }
  function ciz() {
    if (S.sonuc) { app.innerHTML = `<div class="done"><div class="ic" aria-hidden="true">✓</div><h2>Teklif isteğiniz alındı</h2>
      <p>Talep numaranız: <span class="no">${esc(S.sonuc)}</span></p><p class="note">Satış ekibimiz en kısa sürede sizinle iletişime geçecek. Acil durumlar için <a href="https://wa.me/${WA}" target="_blank" rel="noopener">WhatsApp: 0501 136 36 42</a></p>
      <button type="button" class="btn gh" id="yeni">Yeni teklif isteği</button></div>`; $("#yeni").onclick = () => { S.sonuc = null; S.adim = 1; S.t0 = Date.now(); ciz(); }; boy(); return; }
    const n = S.sepet.length;
    app.innerHTML = `<h1>Teklif İste</h1><p class="sub">Ürünü seçin, ölçü/renk/adet bilgilerini girin; satış ekibimiz fiyatlı teklifinizi hazırlayıp size ulaştırsın.</p>
      <div class="steps"><span class="${S.adim === 1 ? "on" : ""}"><b>1</b> Ürünler</span><span class="${S.adim === 2 ? "on" : ""}"><b>2</b> İletişim bilgileri</span></div>
      ${S.adim === 1 ? adim1() : adim2()}`;
    bagla(); boy();
  }
  function adim1() {
    const G = S.kat.gruplar || [], n = S.sepet.length;
    return `<div class="grid"><div class="card"><h2>Ürün seçin</h2>
      ${G.length > 1 ? `<div class="chips" role="group" aria-label="Ürün grubu"><button type="button" class="chip" data-g="" aria-pressed="${!S.grup}">Tümü</button>${G.map(g => `<button type="button" class="chip" data-g="${esc(g.kod)}" aria-pressed="${S.grup === g.kod}">${esc(g.ad)}</button>`).join("")}</div>` : ""}
      <input class="in" id="q" type="search" placeholder="Ürün adı, ölçü ya da kod yazın (örn. menfez 400x200)" value="${esc(S.q)}" aria-label="Ürün ara" autocomplete="off">
      <div class="plist" id="pl">${plHtml()}</div></div>
      <div class="card cartcard"><h2>Teklif listeniz ${n ? `<span class="badge">${n}</span>` : ""}</h2>${sepetHtml()}
      <div class="bar"><span class="note">${n ? "Adetleri buradan değiştirebilirsiniz." : ""}</span><button type="button" class="btn" id="ileri"${n ? "" : " disabled"}>Devam →</button></div></div></div>`;
  }
  function plHtml() {
    const L = urunler();
    if (!L.length) return `<div class="empty">Aramanıza uygun ürün bulunamadı.<br>Listede olmayan bir ürün için bir sonraki adımdaki not alanına yazabilirsiniz.</div>`;
    return L.map(u => `<div class="prow"><div><div class="n">${esc(u.ad)}</div><div class="k">${esc(u.kod)}</div></div><button type="button" class="btn sm${S.ac === u.id ? " gh" : ""}" data-ac="${esc(u.id)}">${S.ac === u.id ? "Kapat" : "Ekle"}</button>
      ${S.ac === u.id ? cfgHtml(u) : ""}</div>`).join("");
  }
  function cfgHtml(u) {
    const V = varList(u.kod, u.ad), R = S.kat.renkler || ["9016", "9010", "7016", "9005"];
    return `<div class="cfg" id="cfg">
      <label>Miktar (${esc(u.birim)})<input class="in" id="cM" type="number" min="1" step="1" inputmode="numeric" value="1"></label>
      <label>Yüzey<select class="in" id="cY">${YUZEY.map(y => `<option>${esc(y)}</option>`).join("")}</select></label>
      <label id="cRw">RAL kodu<input class="in" id="cR" inputmode="numeric" maxlength="4" value="${esc(R[0] || "9016")}"><span class="ral">${R.slice(0, 8).map(k => `<button type="button" data-ral="${esc(k)}" aria-pressed="${k === (R[0] || "9016")}">${esc(k)}</button>`).join("")}</span></label>
      ${V.map((v, i) => v.serbest ? `<label>${esc(v.ad)}${v.birim ? ` (${esc(v.birim)})` : ""}<input class="in" data-v="${i}" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0"></label>`
        : `<label>${esc(v.ad)}<select class="in" data-v="${i}"><option value="">Farketmez</option>${v.sec.map(o => `<option>${esc(o)}</option>`).join("")}</select></label>`).join("")}
      <label class="full">Ölçü / özel not <span class="note" style="font-weight:400">(isteğe bağlı)</span><input class="in" id="cN" maxlength="300" placeholder="Örn. montaj şekli, özel ölçü…"></label>
      <div class="act"><button type="button" class="btn" id="cEk">Listeye ekle</button></div></div>`;
  }
  function sepetHtml() {
    if (!S.sepet.length) return `<div class="empty">Henüz ürün eklemediniz.<br>Ürün listesinden “Ekle” ile seçin.</div>`;
    return `<div class="cart">${S.sepet.map((x, i) => `<div class="ci"><div><div class="n">${esc(x.ad)}</div><small>${esc([renkAd(x.renk), varAd(x.var)].filter(Boolean).join(" · "))}</small>${x.not ? `<small>Not: ${esc(x.not)}</small>` : ""}</div>
      <div><button type="button" class="btn x" data-sil="${i}" aria-label="${esc(x.ad)} listeden çıkar">×</button></div>
      <div class="q full"><input type="number" min="1" step="1" value="${esc(x.miktar)}" data-qm="${i}" aria-label="Adet"> <span class="note">${esc(x.birim)}</span></div></div>`).join("")}</div>`;
  }
  function adim2() {
    const f = S.form, v = k => esc(f[k] || "");
    return `<div class="grid"><div class="card"><h2>İletişim bilgileriniz</h2>
      <div class="form">
        <label>Firma adı *<input class="in" id="fFirma" maxlength="120" value="${v("firma")}" autocomplete="organization"></label>
        <label>Ad soyad *<input class="in" id="fAd" maxlength="80" value="${v("ad")}" autocomplete="name"></label>
        <label>Telefon *<input class="in" id="fTel" maxlength="20" inputmode="tel" value="${v("tel")}" autocomplete="tel" placeholder="05xx xxx xx xx"></label>
        <label>E-posta<input class="in" id="fMail" maxlength="120" type="email" value="${v("eposta")}" autocomplete="email"></label>
        <label>İl<input class="in" id="fIl" maxlength="40" value="${v("il")}" autocomplete="address-level1"></label>
        <label>Proje / şantiye adı<input class="in" id="fProje" maxlength="120" value="${v("proje")}"></label>
        <label class="full">Not<textarea class="in" id="fNot" rows="3" maxlength="1000" placeholder="Teslim tarihi, listede olmayan ürünler, özel istekler…">${v("not")}</textarea></label>
        <div class="hp" aria-hidden="true"><label>Web sitesi<input id="fSite" tabindex="-1" autocomplete="off"></label></div>
        <label class="chk full"><input type="checkbox" id="fKvkk"${f.kvkk ? " checked" : ""}> <span>Teklif hazırlanması ve size dönüş yapılması amacıyla iletişim bilgilerimin Kar-Men Airtech tarafından işlenmesini kabul ediyorum (KVKK).</span></label>
      </div>${S.hata ? `<div class="msg err" role="alert">${esc(S.hata)}</div>` : ""}
      <div class="bar"><button type="button" class="btn gh" id="geri">← Ürünler</button><button type="button" class="btn" id="gonder"${S.gonder ? " disabled" : ""}>${S.gonder ? "Gönderiliyor…" : "Teklif iste"}</button></div></div>
      <div class="card cartcard"><h2>Teklif listeniz <span class="badge">${S.sepet.length}</span></h2>${sepetHtml()}</div></div>`;
  }
  function formOku() { const g = id => (($("#" + id) || {}).value || "").trim(); if (!$("#fFirma")) return;
    S.form = { firma: g("fFirma"), ad: g("fAd"), tel: g("fTel"), eposta: g("fMail"), il: g("fIl"), proje: g("fProje"), not: g("fNot"), kvkk: !!($("#fKvkk") || {}).checked }; sakla(); }
  function bagla() {
    app.querySelectorAll("[data-g]").forEach(b => b.onclick = () => { S.grup = b.dataset.g; S.ac = null; ciz(); });
    const q = $("#q"); if (q) q.oninput = () => { S.q = q.value; S.ac = null; $("#pl").innerHTML = plHtml(); bagla2(); boy(); };
    bagla2();
    app.querySelectorAll("[data-sil]").forEach(b => b.onclick = () => { formOku(); S.sepet.splice(Number(b.dataset.sil), 1); sakla(); ciz(); });
    app.querySelectorAll("[data-qm]").forEach(i => i.onchange = () => { const x = S.sepet[Number(i.dataset.qm)]; x.miktar = Math.max(1, Math.round(Number(i.value) || 1)); i.value = x.miktar; sakla(); });
    const il = $("#ileri"); if (il) il.onclick = () => { S.adim = 2; S.hata = ""; ciz(); scrollTo(0, 0); };
    const ge = $("#geri"); if (ge) ge.onclick = () => { formOku(); S.adim = 1; ciz(); };
    const go = $("#gonder"); if (go) go.onclick = gonder;
    app.querySelectorAll(".form input, .form textarea").forEach(i => i.onchange = formOku);
  }
  function bagla2() {
    app.querySelectorAll("[data-ac]").forEach(b => b.onclick = () => { S.ac = S.ac === b.dataset.ac ? null : b.dataset.ac; $("#pl").innerHTML = plHtml(); bagla2(); boy(); const m = $("#cM"); if (m) m.focus(); });
    const c = $("#cfg"); if (!c) return;
    const u = S.idx.find(x => x.id === S.ac), V = varList(u.kod, u.ad);
    const ry = () => { const b = boyali($("#cY").value); $("#cRw").style.display = b ? "" : "none"; };
    $("#cY").onchange = ry; ry();
    c.querySelectorAll("[data-ral]").forEach(b => b.onclick = () => { $("#cR").value = b.dataset.ral; c.querySelectorAll("[data-ral]").forEach(x => x.setAttribute("aria-pressed", x === b)); });
    $("#cEk").onclick = () => {
      const m = Math.max(1, Math.round(Number($("#cM").value) || 1)), y = $("#cY").value, ral = $("#cR").value.replace(/\D/g, "").slice(0, 4);
      if (boyali(y) && ral.length !== 4) { $("#cR").focus(); $("#cR").setCustomValidity("4 haneli RAL kodu yazın"); $("#cR").reportValidity(); return; }
      const v = {}; c.querySelectorAll("[data-v]").forEach(s => { const d = V[Number(s.dataset.v)]; const x = s.value.trim(); if (!x) return; v[d.ad] = d.serbest ? `${x.replace(".", ",")} ${d.birim}`.trim() : x; });
      S.sepet.push({ id: u.id, kod: u.kod, ad: u.ad, birim: u.birim, miktar: m, renk: boyali(y) ? { yuzey: y, kod: ral } : { yuzey: y }, var: v, not: $("#cN").value.trim().slice(0, 300) });
      S.ac = null; sakla(); ciz();
    };
  }
  async function gonder() {
    formOku(); const f = S.form;
    const telOk = String(f.tel).replace(/\D/g, "").length >= 10, mailOk = !f.eposta || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.eposta);
    S.hata = !f.firma || !f.ad ? "Firma adı ve ad soyad zorunludur." : !telOk ? "Geçerli bir telefon numarası yazın." : !mailOk ? "E-posta adresini kontrol edin." : !f.kvkk ? "Devam etmek için KVKK onayını işaretleyin." : !S.sepet.length ? "Listenize en az bir ürün ekleyin." : "";
    if (S.hata) { ciz(); return; }
    S.gonder = true; ciz();
    try {
      const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ kisi: { firma: f.firma, ad: f.ad, tel: f.tel, eposta: f.eposta, il: f.il, proje: f.proje }, not: f.not, kvkk: true,
